<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
</head>
<body>

<h2>🛒 Checkout</h2>

<img id="productImage" width="200"/>

<h3 id="productName"></h3>
<p id="productPrice"></p>

<br>

<input id="name" placeholder="Your Name" /><br><br>
<input id="phone" placeholder="Phone Number" /><br><br>

<button onclick="placeOrder()">
  BUY NOW
</button>

<script>
  // ✅ GET URL PARAMS
  const params = new URLSearchParams(window.location.search);

  const product = params.get("product");
  const price = params.get("price");
  const image = params.get("image");
  const user = params.get("user");

  // ✅ SHOW DATA
  document.getElementById("productName").innerText = product;
  document.getElementById("productPrice").innerText = "₹" + price;
  document.getElementById("productImage").src = image;

  // ✅ PLACE ORDER
  function placeOrder() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    if (!name || !phone) {
      alert("Please fill all details");
      return;
    }

    // redirect to confirm route
    window.location.href =
      `/confirm-order?user=${encodeURIComponent(user)}&product=${encodeURIComponent(product)}`;
  }
</script>

</body>
</html>
